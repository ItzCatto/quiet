# Each week, check that AdGuard DNS still answers at the addresses the Quiet DNS profiles use.
# GitHub emails the repository owner when a scheduled run fails.
name: Check AdGuard DNS

on:
  schedule:
    - cron: "20 7 * * 1"   # Mondays at 07:20 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ask each AdGuard DNS address for example.com
        run: python3 scripts/check_resolvers.py
